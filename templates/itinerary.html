{% extends "base.html" %}
{% block title %}Rencana perjalanan{% endblock %}
{% block page %}itinerary{% endblock %}
{% block content %}
<section class="wrap sec page-head">
  <h1>Rencana perjalanan</h1>
  <p>Susun destinasi per hari. Rencana tersimpan di browser ini.</p>
  <form class="planner" id="planner">
    <label>Destinasi<select id="planDest" required></select></label>
    <label>Hari<select id="planDay">{% for i in range(1,6) %}<option value="{{ i }}">Hari {{ i }}</option>{% endfor %}</select></label>
    <button class="btn" type="submit">Tambahkan</button>
  </form>
  <div id="state"></div>
  <div class="days" id="days"></div>
  <button class="btn ghost" id="clearPlan" hidden>Kosongkan rencana</button>
</section>
{% endblock %}
